{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card p-4 p-md-5">
<h1 class="h3 mb-1">Welcome back</h1><p class="text-secondary mb-4">Log in to manage your library account.</p>
<form method="post"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required>
<button class="btn btn-primary w-100">Login</button></form><p class="mt-3 mb-0 text-center">New student? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div></div>{% endblock %}
