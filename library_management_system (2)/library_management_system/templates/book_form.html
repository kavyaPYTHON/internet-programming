{% extends "base.html" %}{% block title %}{{ 'Edit' if book else 'Add' }} Book{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="card p-4"><h1 class="h3">{{ 'Edit book' if book else 'Add a book' }}</h1>
<form method="post"><div class="row g-3"><div class="col-md-8"><label class="form-label">Title *</label><input class="form-control" name="title" value="{{ book.title if book else '' }}" required></div><div class="col-md-4"><label class="form-label">Author *</label><input class="form-control" name="author" value="{{ book.author if book else '' }}" required></div>
<div class="col-md-4"><label class="form-label">ISBN</label><input class="form-control" name="isbn" value="{{ book.isbn if book else '' }}"></div><div class="col-md-4"><label class="form-label">Category</label><input class="form-control" name="category" value="{{ book.category if book else '' }}"></div><div class="col-md-4"><label class="form-label">Publication year</label><input class="form-control" type="number" min="1000" max="2100" name="year" value="{{ book.year if book and book.year else '' }}"></div>
<div class="col-md-4"><label class="form-label">Total copies</label><input class="form-control" type="number" min="1" name="total_copies" value="{{ book.total_copies if book else 1 }}" required></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="4">{{ book.description if book else '' }}</textarea></div></div><div class="mt-4"><button class="btn btn-primary">Save book</button> <a class="btn btn-outline-secondary" href="{{ url_for('manage_books') }}">Cancel</a></div></form>
</div></div></div>{% endblock %}
