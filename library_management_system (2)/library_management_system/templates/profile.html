{% extends "base.html" %}{% block title %}My Profile{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-7"><div class="card p-4"><h1 class="h3">My profile</h1><form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" value="{{ user.name }}" required><label class="form-label">Email (cannot be changed here)</label><input class="form-control mb-3" value="{{ user.email }}" disabled><label class="form-label">Phone</label><input class="form-control mb-4" name="phone" value="{{ user.phone or '' }}"><button class="btn btn-primary">Save profile</button></form></div></div></div>{% endblock %}
