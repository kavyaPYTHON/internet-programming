{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-7 col-lg-6"><div class="card p-4 p-md-5">
<h1 class="h3">Create student account</h1><p class="text-secondary">Use your email to access library services.</p>
<form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required>
<label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Phone (optional)</label><input class="form-control mb-3" name="phone">
<label class="form-label">Password (at least 8 characters)</label><input class="form-control mb-4" type="password" name="password" minlength="8" required>
<button class="btn btn-primary w-100">Register</button></form></div></div></div>{% endblock %}
