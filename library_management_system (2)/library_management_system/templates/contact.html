{% extends "base.html" %}{% block title %}Contact Library{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-8 col-lg-7"><div class="card p-4 p-md-5"><h1 class="h2">Contact the library</h1><p class="text-secondary">Questions about books, returns or study materials? Send us a message.</p><form method="post"><label class="form-label">Name</label><input class="form-control mb-3" name="name" value="{{ current_user or '' }}" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Message</label><textarea class="form-control mb-4" name="message" rows="5" required></textarea><button class="btn btn-primary">Send message</button></form></div></div></div>{% endblock %}
